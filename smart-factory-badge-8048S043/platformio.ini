[env:esp32-s3-devkitc-1]
; Match the user's successful ZIP build: Arduino-ESP32 3.1.3 / ESP-IDF 5.3.2.
; The standard PlatformIO espressif32 platform still resolves to Arduino Core 2.x,
; which is incompatible with Arduino_GFX 1.6.7 (missing esp32-hal-periman.h).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Arduino_GFX contains drivers for many unrelated displays. Linking its objects
; directly avoids a large temporary archive on low-free-space build machines.
lib_archive = no

; ESP32-8048S043 is ESP32-S3 N16R8: 16 MB QSPI Flash + 8 MB OPI PSRAM.
; RGB565 needs a 750 KiB framebuffer in PSRAM.
board_upload.flash_size = 16MB
; ESP32-S3 boots this quad Flash reliably in DIO; PSRAM remains 8 MB Octal.
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DU8G2_USE_LARGE_FONTS

lib_deps =
    moononournation/GFX Library for Arduino@1.6.7
    olikraus/U8g2@2.36.18
